name: Test and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: node scripts/auth_state_smoke.cjs
      - run: docker compose --env-file .env.example config --quiet
      - run: pip install 'playwright>=1.50,<2'
      - run: playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/nasrelay-*.png
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run published container on amd64
        if: github.event_name != 'pull_request'
        env:
          SMOKE_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --detach --rm --name relay-smoke --read-only --tmpfs /tmp -p 127.0.0.1:18080:8080 "$SMOKE_IMAGE"
          python - <<'PYTEST'
          import json, time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=2) as response:
                      assert json.load(response)['version'] == '1.2.2'
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise RuntimeError('Published container did not become healthy')
          PYTEST
      - name: Clean up smoke container
        if: always() && github.event_name != 'pull_request'
        run: |
          docker logs relay-smoke || true
          docker stop relay-smoke || true
